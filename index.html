<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapterwise Practice Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3f5f1; --card:#ffffff; --ink:#152238; --ink-fg:#ffffff; --muted:#5b6778; --line:#d9ded5;
  --green:#1c6b57; --green-soft:#dcefe7; --red:#b8322a; --red-soft:#f8e1de;
  --amber:#8f5f00; --amber-soft:#fbefc9; --steel:#4a78a8; --new:#d3d9d0; --focus:#2b6cb0;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
[data-theme="dark"]{
  --paper:#0e1512; --card:#151f1b; --ink:#e8efe9; --ink-fg:#0e1512; --muted:#93a39a; --line:#26342e;
  --green:#4fbf9a; --green-soft:#16332a; --red:#ef7a70; --red-soft:#3a1f1c;
  --amber:#e0b04a; --amber-soft:#3a2f12; --steel:#7ba7d4; --new:#2c3a34; --focus:#7ba7d4;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.5;min-height:100vh;padding-bottom:84px;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}

/* top bar + nav */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand{font-family:var(--serif);font-weight:600;font-size:1.25rem;letter-spacing:.1px}
.brand small{display:block;font-family:var(--sans);font-weight:400;font-size:.78rem;color:var(--muted)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:6px;width:38px;height:38px;font-size:1.05rem}
.nav{display:flex;gap:4px}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:500;color:var(--muted)}
.nav button.on{color:var(--ink);border-bottom-color:var(--green)}
@media (max-width:720px){
  .nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;z-index:20;padding:4px 0 max(4px,env(safe-area-inset-bottom))}
  .nav button{flex:1;border:0;padding:6px 2px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px}
  .nav button span.ic{font-size:1.15rem}
  .nav button.on{color:var(--green);font-weight:600}
}
@media (min-width:721px){.nav .ic{display:none}}

/* generic */
h2{font-family:var(--serif);font-size:1.35rem;font-weight:600;margin-bottom:4px}
h3{font-size:1rem;font-weight:600;margin-bottom:8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.panel.flat{border-radius:4px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:9px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn:hover{background:var(--paper)}
.btn.primary{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.good{background:var(--green);color:#fff;border-color:var(--green)}
.btn.warn{color:var(--red);border-color:var(--red)}
.btn.small{padding:5px 10px;min-height:32px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.chip.on b{color:inherit;opacity:.8}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--card);border:0;padding:8px 12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--ink-fg)}
select,input[type=text],input[type=number],textarea{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%}
select{width:auto;max-width:100%}
textarea{resize:vertical;min-height:64px;font-size:.92rem}
label.field{display:block;font-weight:500;margin:14px 0 6px}
.switch{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.switch input{width:20px;height:20px;margin-top:2px;accent-color:var(--green)}
.switch span small{display:block;color:var(--muted);font-size:.82rem}

/* mastery bar */
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--new);min-width:80px}
.bar i{display:block;height:100%}
.bar .m{background:var(--green)} .bar .l{background:var(--steel)} .bar .w{background:var(--red)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend s{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;text-decoration:none;vertical-align:baseline}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{position:relative;width:96px;height:96px}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring .c b{font-size:1.4rem;font-family:var(--serif)}
.ring .c span{font-size:.72rem;color:var(--muted)}
.next-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.next{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:12px 14px;width:100%}
.next:hover{border-color:var(--ink)}
.next.first{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.next.first small{color:inherit;opacity:.8}
.next small{display:block;color:var(--muted);font-size:.82rem}
.chap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.4fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.chap:first-of-type{border-top:0}
.chap .t{font-weight:600}
.chap .pct{font-family:var(--serif);font-size:1.15rem;font-weight:600;min-width:46px;text-align:right}
@media (max-width:620px){.chap{grid-template-columns:1fr auto}.chap .bar-col{grid-column:1/-1;order:3}}

/* run */
.runhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prog{flex:1;height:6px;background:var(--new);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);transition:width .25s}
.timer{font-variant-numeric:tabular-nums;font-weight:600;min-width:52px;text-align:right}
.timer.low{color:var(--red)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px}
.qmeta{color:var(--muted);font-size:.83rem;margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{border:1px solid var(--line);border-radius:4px;padding:1px 8px;font-size:.78rem}
.tag.weak{color:var(--red);border-color:var(--red)} .tag.learning{color:var(--steel);border-color:var(--steel)} .tag.mastered{color:var(--green);border-color:var(--green)}
.qtext{font-family:var(--serif);font-size:1.28rem;line-height:1.5;margin-bottom:20px;font-weight:400}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:11px 14px;min-height:50px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.bub{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:600;color:var(--muted);background:var(--card)}
.opt .tx{flex:1;overflow-wrap:anywhere}
.opt .mk{font-weight:700;min-width:16px;text-align:center}
.opt.sel{border-color:var(--ink)} .opt.sel .bub{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.opt.ok{background:var(--green-soft);border-color:var(--green)} .opt.ok .bub{background:var(--green);border-color:var(--green);color:#fff} .opt.ok .mk{color:var(--green)}
.opt.bad{background:var(--red-soft);border-color:var(--red)} .opt.bad .bub{background:var(--red);border-color:var(--red);color:#fff} .opt.bad .mk{color:var(--red)}
.opt.dim{opacity:.6}
.fb{margin-top:18px;border-left:4px solid var(--line);padding:10px 14px;background:var(--paper);border-radius:0 6px 6px 0}
.fb.ok{border-left-color:var(--green)} .fb.bad{border-left-color:var(--red)} .fb.warn{border-left-color:var(--amber)}
.fb b.t-ok{color:var(--green)} .fb b.t-bad{color:var(--red)} .fb b.t-warn{color:var(--amber)}
.dots{letter-spacing:3px;color:var(--green)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tools .btn.on{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px}
.pal{height:36px;border-radius:5px;border:1px solid var(--line);background:var(--card);font-size:.82rem;font-variant-numeric:tabular-nums}
.pal.ans{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.pal.flag{box-shadow:inset 0 -4px 0 var(--amber)}
.pal.cur{outline:2px solid var(--focus);outline-offset:1px}
.pal.okp{background:var(--green);border-color:var(--green);color:#fff} .pal.badp{background:var(--red);border-color:var(--red);color:#fff}
details.pdet summary{cursor:pointer;font-weight:500;padding:6px 0}

/* flashcards */
.fc{perspective:1200px;margin-bottom:14px}
.fc-in{display:grid;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px;min-height:240px;display:flex;flex-direction:column;justify-content:center}
.face.back{transform:rotateY(180deg);background:var(--green-soft);border-color:var(--green)}
.face .ans{font-family:var(--serif);font-size:1.3rem;font-weight:600;color:var(--green)}
.face .others{margin-top:12px;font-size:.88rem;color:var(--muted)}

/* summary */
.score{font-family:var(--serif);font-size:3rem;font-weight:600;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--card)}
.stat b{display:block;font-family:var(--serif);font-size:1.4rem;font-weight:600}
.stat span{font-size:.8rem;color:var(--muted)}
.review-item{border-top:1px solid var(--line);padding:16px 0}
.review-item:first-child{border-top:0}
.review-item .qtext{font-size:1.08rem;margin-bottom:12px}
.note-area{margin-top:10px}

/* reports */
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:.82rem;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.scroll-x{overflow-x:auto}
.insight{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.insight:first-of-type{border-top:0}
.insight .dot{flex:0 0 10px;height:10px;border-radius:50%;margin-top:7px;background:var(--steel)}
.insight.bad .dot{background:var(--red)} .insight.warn .dot{background:var(--amber)} .insight.good .dot{background:var(--green)}
.insight .tx{flex:1}
.mq{padding:10px 0;border-top:1px solid var(--line)}
.mq:first-of-type{border-top:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--ink-fg);padding:10px 16px;border-radius:6px;z-index:50;max-width:90vw;font-size:.9rem}
#print-area{display:none}
@media print{
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important;color:#000;background:#fff;padding:0;font-family:Georgia,serif}
  #print-area h1{font-size:18pt;margin-bottom:4pt}
  #print-area .pi{margin:12pt 0;page-break-inside:avoid}
  #print-area .pq{font-weight:bold;margin-bottom:4pt}
  #print-area .po{margin-left:14pt}
  #print-area .po.c{font-weight:bold}
  #print-area .pn{margin:4pt 0 0 14pt;font-style:italic;font-size:10pt}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div id="print-area"></div>

const chaptersData = {};
Object.values(chapterMeta).forEach(meta => { chaptersData[meta.key] = { title: meta.title, questions: [] }; });
const QS = {};
rawData.forEach(row => {
  const [cat, id, question, o1, o2, o3, o4, ans] = row;
  const key = chapterMeta[cat].key;
  const q = { id, ch: key, question, options: [o1, o2, o3, o4], answer: ans.trim() };
  q.ai = q.answer.charCodeAt(0) - 65;
  chaptersData[key].questions.push(q);
  QS[id] = q;
});
const CH_KEYS = Object.keys(chaptersData);
const TOTAL_Q = rawData.length;
const chTitle = k => chaptersData[k].title.replace(/^\d+\.\s*/, '');

/* Options such as "Both A and B" or "All of these" only make sense in their original
   order, so those questions are never shuffled. */
const REF_RE = /\b(both|all of|none of|neither|above|these|none)\b|\b[A-D]\s*(and|&|,|or)\s*[A-D]\b/i;
const shuffleSafe = q => !q.options.some(o => REF_RE.test(String(o)));

/* =====================================================================

   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = n => Math.round(n * 100) + '%';
const LET = 'ABCD';
const DAY = 864e5;
const INTERVALS = [0, 1, 3, 7, 14, 30];
const shuffleArr = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmtT = ms => { const s = Math.round(ms / 1000); const m = Math.floor(s / 60); return m ? `${m}m ${String(s % 60).padStart(2, '0')}s` : `${s}s`; };
const clockT = s => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const plural = (n, w, w2) => `${n} ${n === 1 ? w : (w2 || w + 's')}`;

const KEY = 'portal-v2';
const blank = () => ({ v: 2, q: {}, sessions: [], days: {}, set: { shuffle: false, auto: false, guess: false, goal: 20, theme: '' }, usedGuess: 0, migrated: 0 });
let db = blank();
function loadDB() {
  try { const raw = localStorage.getItem(KEY); if (raw) db = JSON.parse(raw); } catch (e) { db = blank(); }
  const b = blank();
  db = Object.assign(b, db); db.set = Object.assign(b.set, db.set || {});
  db.q = db.q || {}; db.days = db.days || {}; db.sessions = db.sessions || [];
  migrateLegacy();
}
let saveTimer = null, saveWarned = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { if (!saveWarned) { saveWarned = true; toast('Progress could not be saved in this browser. Use Reports → Export to keep a copy.'); } }
}
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); }
function migrateLegacy() {
  if (db.migrated) return;
  db.migrated = 1;
  let old; try { old = JSON.parse(localStorage.getItem('portal-progress') || '{}'); } catch (e) { old = {}; }
  let n = 0; const now = Date.now();
  Object.keys(old).forEach(id => {
    const q = QS[id]; if (!q) return;
    const ok = old[id] === q.answer ? 1 : 0;
    db.q[id] = { a: [[now, old[id], ok, 0, 0, 'm']], streak: ok, due: ok ? now + DAY : now, bm: 0, note: '' };
    n++;
  });
  if (n) { db.legacyImported = n; }
  save();
}
const getRec = id => db.q[id] || (db.q[id] = { a: [], streak: 0, due: 0, bm: 0, note: '' });

/* =====================================================================
   Learning model
   new      = never attempted
   weak     = last answer wrong (or a lucky guess) -> needs work
   learning = 1-2 correct in a row
   mastered = 3 correct in a row (no guesses)
   Reviews come back on a spaced schedule: 1, 3, 7, 14, 30 days.
   ===================================================================== */
function status(id) {
  const r = db.q[id];
  if (!r || !r.a.length) return 'new';
  if (r.streak >= 3) return 'mastered';
  if (r.streak >= 1) return 'learning';
  return 'weak';
}
const isDue = id => { const r = db.q[id]; return !!(r && r.a.length && r.due <= Date.now()); };
const isReview = id => isDue(id) && status(id) !== 'weak';

function record(id, letter, ms, guess, src) {
  const q = QS[id]; const ok = letter === q.answer ? 1 : 0; const r = getRec(id); const now = Date.now();
  r.a.push([now, letter, ok, ms, guess ? 1 : 0, src]); if (r.a.length > 30) r.a.shift();
  if (ok && !guess) { r.streak++; r.due = now + INTERVALS[Math.min(r.streak, 5)] * DAY; }
  else if (ok && guess) { r.due = now + DAY; }
  else { r.streak = 0; r.due = now; }
  const k = dayKey(now); const d = db.days[k] || (db.days[k] = { n: 0, c: 0 }); d.n++; d.c += ok;
  if (guess) db.usedGuess = 1;
  saveSoon();
  return ok;
}

function chapStats(key) {
  const c = { new: 0, weak: 0, learning: 0, mastered: 0, total: 0, attempts: 0, correct: 0, ms: 0, msN: 0, due: 0, guess: 0 };
  chaptersData[key].questions.forEach(q => {
    c.total++; const st = status(q.id); c[st]++;
    const r = db.q[q.id];
    if (r) r.a.forEach(x => { c.attempts++; c.correct += x[2]; if (x[4]) c.guess++; if (x[3] > 0 && x[3] < 180000) { c.ms += x[3]; c.msN++; } });
    if (isReview(q.id)) c.due++;
  });
  c.acc = c.attempts ? c.correct / c.attempts : 0;
  c.avgMs = c.msN ? c.ms / c.msN : 0;
  c.ready = (c.mastered + 0.5 * c.learning) / c.total;
  return c;
}
function totals() {
  const t = { new: 0, weak: 0, learning: 0, mastered: 0, total: 0, attempts: 0, correct: 0, ms: 0, msN: 0, due: 0, guess: 0 };
  CH_KEYS.forEach(k => { const c = chapStats(k); Object.keys(t).forEach(f => t[f] += c[f]); });
  t.acc = t.attempts ? t.correct / t.attempts : 0; t.avgMs = t.msN ? t.ms / t.msN : 0; t.ready = (t.mastered + 0.5 * t.learning) / t.total;
  return t;
}
function dayStreak() {
  let n = 0; const d = new Date();
  if (!db.days[dayKey(d)]) d.setDate(d.getDate() - 1);
  while (db.days[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const todayCount = () => (db.days[dayKey(Date.now())] || { n: 0 }).n;

/* =====================================================================
   Decks
   ===================================================================== */
const FILTERS = {
  smart: id => status(id) === 'weak' || isReview(id) || status(id) === 'new',
  all: () => true,
  new: id => status(id) === 'new',
  weak: id => status(id) === 'weak',
  due: id => isReview(id),
  learning: id => status(id) === 'learning',
  mastered: id => status(id) === 'mastered',
  bm: id => !!(db.q[id] && db.q[id].bm)
};
const FILTER_LABEL = { smart: 'Smart mix', all: 'Everything', new: 'Not tried yet', weak: 'Needs work', due: 'Due for review', bm: 'Bookmarked', learning: 'Learning', mastered: 'Mastered' };
const scopeIds = scope => (scope === 'all' ? CH_KEYS : [scope]).flatMap(k => chaptersData[k].questions.map(q => q.id));
const rank = id => status(id) === 'weak' ? 0 : isReview(id) ? 1 : status(id) === 'new' ? 2 : 3;
function groupedOrder(ids, random) {
  const groups = [[], [], [], []];
  ids.forEach(id => groups[rank(id)].push(id));
  return groups.flatMap(g => random ? shuffleArr(g) : g);
}
function buildDeck({ scope, filter, order, count }) {
  let ids = scopeIds(scope).filter(FILTERS[filter]);
  if (filter === 'smart') ids = groupedOrder(ids, order === 'rand');
  else if (order === 'rand') ids = shuffleArr(ids);
  if (count) ids = ids.slice(0, count);
  return ids;
}
const countFilter = (scope, f) => scopeIds(scope).filter(FILTERS[f]).length;

let toastTimer = null;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3200);

/* =====================================================================
   Sessions (practice, mock test, flashcards)
   ===================================================================== */
const cur = () => S.type === 'flash' ? S.queue[0] : S.ids[S.i];
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function endRun() { stopTimer(); S = null; }
function go(v) { view = v; render(); window.scrollTo(0, 0); }

function startSession(type, ids, o = {}) {
  if (!ids.length) { toast('No questions match that yet. Try a different filter.'); return; }
  stopTimer();
  S = { type, ids, i: 0, ans: {}, flag: {}, spent: {}, order: {}, start: Date.now(), qStart: Date.now(), label: o.label || '', neg: !!o.neg, perQ: o.perQ || 0, guess: false, flip: false };
  ids.forEach(id => {
    const q = QS[id]; const idx = [0, 1, 2, 3];
    S.order[id] = (type !== 'flash' && db.set.shuffle && shuffleSafe(q)) ? shuffleArr(idx) : idx;
  });
  if (type === 'flash') { S.queue = ids.slice(); S.known = 0; S.miss = {}; S.total = ids.length; }
  if (type === 'test' && S.perQ) S.deadline = Date.now() + ids.length * S.perQ * 1000;
  view = 'run'; render(); window.scrollTo(0, 0);
  timerId = setInterval(tick, 1000);
}
function tick() {
  if (view !== 'run' || !S) return;
  const el = $('#timer');
  if (S.type === 'test' && S.deadline) {
    const left = (S.deadline - Date.now()) / 1000;
    if (el) { el.textContent = clockT(left); el.classList.toggle('low', left < 60); }
    if (left <= 0) finishTest(true);
  } else if (el) el.textContent = clockT((Date.now() - S.start) / 1000);
}
function leaveQ() { if (S && S.type === 'test') { const id = cur(); S.spent[id] = (S.spent[id] || 0) + (Date.now() - S.qStart); } }
function jump(i) { leaveQ(); S.i = i; S.qStart = Date.now(); S.guess = false; render(); }
function next() {
  if (!S || S.type === 'flash') return;
  if (S.i < S.ids.length - 1) jump(S.i + 1);
  else if (S.type === 'practice') finishPractice();
  else toast('That was the last question. Submit when you are ready.');
}
function prev() { if (S && S.type !== 'flash' && S.i > 0) jump(S.i - 1); }
function pick(oi) {
  if (!S || S.type === 'flash') return;
  const id = cur(); const letter = LET[oi];
  if (S.type === 'practice') {
    if (S.ans[id]) return;
    const ms = Date.now() - S.qStart; const g = (db.set.guess && S.guess) ? 1 : 0;
    S.ans[id] = { ch: letter, ms, g }; record(id, letter, ms, g, 'p');
    render();
    if (db.set.auto && letter === QS[id].answer && !g) { const at = S.i; setTimeout(() => { if (S && view === 'run' && S.i === at) next(); }, 900); }
  } else {
    if (S.ans[id] && S.ans[id].ch === letter) delete S.ans[id]; else S.ans[id] = { ch: letter };
    render();
  }
}
function storeSession(s) { db.sessions.push(s); if (db.sessions.length > 40) db.sessions.shift(); save(); }
function finishPractice() {
  const res = S.ids.filter(id => S.ans[id]).map(id => { const a = S.ans[id]; return [id, a.ch, a.ch === QS[id].answer ? 1 : 0, a.ms, a.g || 0]; });
  if (!res.length) { endRun(); go('practice'); return; }
  SUM = { t: Date.now(), type: 'practice', label: S.label, res, skip: S.ids.filter(id => !S.ans[id]), time: Date.now() - S.start };
  storeSession(SUM); endRun(); ui.sumFilter = res.some(r => !r[2]) ? 'wrong' : 'all'; go('summary');
}
function finishTest(auto) {
  if (!S || S.type !== 'test') return;
  leaveQ();
  const answered = S.ids.filter(id => S.ans[id]); const un = S.ids.length - answered.length;
  if (!auto && un > 0 && !confirm(`${plural(un, 'question')} still unanswered. Submit anyway?`)) return;
  const res = []; let right = 0, wrong = 0;
  answered.forEach(id => { const a = S.ans[id]; const ms = S.spent[id] || 0; const ok = record(id, a.ch, ms, 0, 't'); res.push([id, a.ch, ok, ms, 0]); ok ? right++ : wrong++; });
  const marks = right - (S.neg ? wrong * 0.25 : 0);
  SUM = { t: Date.now(), type: 'test', label: S.label, res, skip: S.ids.filter(id => !S.ans[id]), neg: S.neg, marks, max: S.ids.length, time: Date.now() - S.start, flagged: S.ids.filter(id => S.flag[id]) };
  storeSession(SUM); endRun(); ui.sumFilter = (wrong || un) ? 'wrong' : 'all'; go('summary');
}
function finishFlash() {
  const missed = Object.keys(S.miss);
  SUM = { t: Date.now(), type: 'flash', label: S.label, total: S.total, missed, misses: S.miss, time: Date.now() - S.start, res: [], skip: [] };
  storeSession(SUM); endRun(); go('summary');
}
function exitRun() {
  if (!S) return;
  if (S.type === 'test') { if (!confirm('Leave this test? Your answers will not be saved.')) return; endRun(); go('test'); return; }
  if (S.type === 'practice' && Object.keys(S.ans).length) { finishPractice(); return; }
  const back = S.type === 'flash' ? 'practice' : 'practice'; endRun(); go(back);
}

/* ---------- Reports ---------- */
function histRow(s, i) {
  const d = new Date(s.t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  let score = '';
  if (s.type === 'test') score = `${(s.neg ? s.marks : s.res.filter(r => r[2]).length)}/${s.max}`.replace(/(\.\d*?)0+\//, '$1/');
  else if (s.type === 'practice') score = `${s.res.filter(r => r[2]).length}/${s.res.length}`;
  else score = `${s.total - s.missed.length}/${s.total} first time`;
  const kind = { test: 'Mock test', practice: 'Practice', flash: 'Flashcards' }[s.type];
  return `<button class="next" style="margin-bottom:6px" data-act="open-session" data-i="${i}"><span><b>${kind}</b> <span class="muted">· ${esc(s.label || 'Mixed')}</span><small>${d} · ${fmtT(s.time)}</small></span><b class="num">${score}</b></button>`;
}
function trendSvg() {
  const days = [];
  for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const k = dayKey(d); const x = db.days[k] || { n: 0, c: 0 }; days.push({ d, n: x.n, c: x.c }); }
  const max = Math.max(5, ...days.map(x => x.n)); const bw = 22, gap = 8, base = 96, top = 78;
  const bars = days.map((x, i) => {
    const px = 6 + i * (bw + gap); const ht = x.n / max * top; const hc = x.c / max * top;
    return `<g><rect x="${px}" y="${base - ht}" width="${bw}" height="${Math.max(0, ht - hc)}" style="fill:var(--red)"/><rect x="${px}" y="${base - hc}" width="${bw}" height="${hc}" style="fill:var(--green)"/>` +
      (x.n ? `<text x="${px + bw / 2}" y="${base - ht - 4}" text-anchor="middle" font-size="9" style="fill:var(--muted)">${x.n}</text>` : '') +
      `<text x="${px + bw / 2}" y="112" text-anchor="middle" font-size="9" style="fill:var(--muted)">${x.d.getDate()}</text></g>`;
  }).join('');
  return `<svg viewBox="0 0 420 120" width="100%" role="img" aria-label="Questions answered per day for the last 14 days, correct in green and wrong in red"><line x1="0" y1="${base}" x2="420" y2="${base}" style="stroke:var(--line)"/>${bars}</svg>`;
}
function mostMissed() {
  return Object.keys(db.q).filter(id => QS[id]).map(id => {
    const r = db.q[id]; const w = r.a.filter(x => !x[2] && x[5] !== 'm'); const cnt = {}; w.forEach(x => cnt[x[1]] = (cnt[x[1]] || 0) + 1);
    const top = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
    return { id, misses: w.length, top, last: w.length ? lastOf(w)[0] : 0 };
  }).filter(x => x.misses && status(x.id) !== 'mastered').sort((a, b) => b.misses - a.misses || b.last - a.last).slice(0, 8);
}
function slowest(overall) {
  if (!overall) return [];
  return Object.keys(db.q).filter(id => QS[id]).map(id => {
    const ms = db.q[id].a.filter(x => x[3] > 0 && x[3] < 180000 && x[5] !== 'm').map(x => x[3]);
    return { id, avg: ms.length ? ms.reduce((a, b) => a + b, 0) / ms.length : 0, n: ms.length };
  }).filter(x => x.n && x.avg >= Math.max(12000, overall * 1.6)).sort((a, b) => b.avg - a.avg).slice(0, 5);
}
function insights() {
  const out = []; const T = totals();
  if (T.attempts < 5) return out;
  const cs = CH_KEYS.map(k => ({ k, c: chapStats(k) })); const seen = cs.filter(x => x.c.attempts >= 8);
  if (seen.length) {
    const w = [...seen].sort((a, b) => a.c.acc - b.c.acc)[0];
    if (w.c.acc < 0.75) out.push({ tone: w.c.acc < 0.55 ? 'bad' : 'warn', t: `${chTitle(w.k)} is your weakest chapter: ${pct(w.c.acc)} accuracy with ${plural(w.c.weak, 'question')} needing work.`, btn: 'Drill it', act: 'drill', k: w.k });
    const s = [...seen].sort((a, b) => b.c.acc - a.c.acc)[0];
    if (s.k !== w.k && s.c.acc >= 0.8) out.push({ tone: 'good', t: `${chTitle(s.k)} is your strongest chapter at ${pct(s.c.acc)}. A short review every few days is enough there.` });
  }
  const rep = Object.keys(db.q).filter(id => QS[id] && db.q[id].a.filter(x => !x[2] && x[5] !== 'm').length >= 2 && status(id) !== 'mastered');
  if (rep.length) out.push({ tone: 'bad', t: `${plural(rep.length, 'question')} missed two or more times. Repeat misses usually mean two similar answers are being mixed up. Say the correct option out loud and write a note.`, btn: 'Drill them', act: 'drill-ids', ids: rep.slice(0, 20).join(',') });
  if (T.due) out.push({ tone: 'warn', t: `${plural(T.due, 'review')} due. Reviewing on schedule is the cheapest way to keep what you have mastered.`, btn: 'Review now', act: 'drill-due' });
  if (T.guess) {
    const gOk = Object.values(db.q).reduce((n, r) => n + r.a.filter(x => x[4] && x[2]).length, 0);
    out.push({ tone: 'warn', t: `You marked ${plural(T.guess, 'answer')} as guesses (${gOk} landed). Lucky guesses look like knowledge but are not, so they stay in your queue.` });
  }
  if (db.usedGuess) {
    const cw = Object.values(db.q).reduce((n, r) => n + r.a.filter(x => !x[2] && !x[4] && x[5] !== 'm').length, 0);
    if (cw >= 3) out.push({ tone: 'bad', t: `You were confident and wrong ${cw} times. These are misconceptions, and they matter more than guesses. Read those explanations first.`, btn: 'See them', act: 'nav', v: 'notebook' });
  }
  if (T.avgMs) {
    const slow = cs.filter(x => x.c.msN >= 8 && x.c.avgMs > 1.5 * T.avgMs).sort((a, b) => b.c.avgMs - a.c.avgMs)[0];
    if (slow) out.push({ tone: 'warn', t: `You take about ${fmtT(slow.c.avgMs)} per question in ${chTitle(slow.k)} against ${fmtT(T.avgMs)} overall. Slow recall usually means the idea is not automatic yet. Flashcards help here.`, btn: 'Flashcards', act: 'flash-ch', k: slow.k });
  }
  const sumDays = (from, to) => { let n = 0, c = 0; for (let i = from; i < to; i++) { const d = new Date(); d.setDate(d.getDate() - i); const x = db.days[dayKey(d)]; if (x) { n += x.n; c += x.c; } } return { n, c }; };
  const a = sumDays(0, 7), b = sumDays(7, 14);
  if (a.n >= 10 && b.n >= 10) { const diff = Math.round((a.c / a.n - b.c / b.n) * 100); if (Math.abs(diff) >= 3) out.push({ tone: diff > 0 ? 'good' : 'warn', t: `Accuracy is ${diff > 0 ? 'up' : 'down'} ${Math.abs(diff)} points on the previous week (${pct(a.c / a.n)} vs ${pct(b.c / b.n)}).` }); }
  const st = dayStreak(); if (st >= 2) out.push({ tone: 'good', t: `${st} days in a row. Consistency beats long cramming sessions.` });
  if (T.new / TOTAL_Q > 0.5) out.push({ tone: 'info', t: `${T.new} of ${TOTAL_Q} questions are still untouched. Coverage matters as much as accuracy.` });
  return out;
}
function renderReports() {
  const T = totals();
  if (T.attempts === 0 && !db.sessions.length) {
    return `<section class="panel"><h2>Reports</h2><p class="muted">Nothing to report yet. Answer a few questions and this page will show accuracy by chapter, your most-missed questions, pace and personalised coaching.</p><div class="row" style="margin-top:12px"><button class="btn primary" data-act="nav" data-v="practice">Start practising</button></div></section>${dataTools()}`;
  }
  const ins = insights(); const mm = mostMissed(); const sl = slowest(T.avgMs);
  const hist = db.sessions.map((s, i) => [s, i]).reverse().slice(0, 8);
  return `
  <section class="panel">
    <h2>Reports</h2>
    <div class="stats" style="margin-top:12px">
      <div class="stat"><b class="num">${pct(T.ready)}</b><span>exam-ready</span></div>
      <div class="stat"><b class="num">${T.mastered}<small class="muted" style="font-size:.8rem">/${TOTAL_Q}</small></b><span>mastered</span></div>
      <div class="stat"><b class="num">${T.attempts ? pct(T.acc) : '-'}</b><span>accuracy</span></div>
      <div class="stat"><b class="num">${T.avgMs ? fmtT(T.avgMs) : '-'}</b><span>per question</span></div>
      <div class="stat"><b class="num">${T.attempts}</b><span>answers given</span></div>
    </div>
    <p class="small muted" style="margin-top:10px">Exam-ready counts a mastered question as 1 and a learning question as ½. A question is mastered after 3 correct answers in a row without guessing.</p>
  </section>
  <section class="panel"><h3>What to do next</h3>
    ${ins.length ? ins.map(x => `<div class="insight ${x.tone}"><span class="dot"></span><div class="tx">${esc(x.t)}</div>${x.btn ? `<button class="btn small" data-act="${x.act}" ${x.k ? `data-k="${x.k}"` : ''} ${x.ids ? `data-ids="${x.ids}"` : ''} ${x.v ? `data-v="${x.v}"` : ''}>${x.btn}</button>` : ''}</div>`).join('') : '<p class="muted">Answer a few more questions and personalised coaching will appear here.</p>'}
  </section>
  <section class="panel"><div class="row between" style="margin-bottom:6px"><h3 style="margin:0">By chapter</h3>${LEGEND}</div>
    <div class="scroll-x"><table class="tbl"><tr><th>Chapter</th><th style="min-width:120px">Mastery</th><th class="r">Accuracy</th><th class="r">Pace</th><th></th></tr>
    ${CH_KEYS.map(k => { const c = chapStats(k); return `<tr><td>${esc(chTitle(k))}</td><td>${stackBar(c)}</td><td class="r num">${c.attempts ? pct(c.acc) : '-'}</td><td class="r num">${c.avgMs ? fmtT(c.avgMs) : '-'}</td><td class="r"><button class="btn small" data-act="drill" data-k="${k}" ${c.weak + c.due + c.new ? '' : 'disabled'}>Drill</button></td></tr>`; }).join('')}
    </table></div>
  </section>
  <section class="panel"><h3>Last 14 days</h3>${trendSvg()}<div class="legend" style="margin-top:4px"><span><s style="background:var(--green)"></s>Correct</span><span><s style="background:var(--red)"></s>Wrong</span></div></section>
  ${mm.length ? `<section class="panel"><div class="row between"><h3 style="margin:0">Most-missed questions</h3><button class="btn small" data-act="drill-ids" data-ids="${mm.map(x => x.id).join(',')}">Drill these ${mm.length}</button></div>
    ${mm.map(x => { const q = QS[x.id]; return `<div class="mq"><div class="small muted">${x.id} · ${esc(chTitle(q.ch))} · missed ${x.misses}×</div><div>${esc(q.question)}</div><div class="small" style="margin-top:4px"><span style="color:var(--green)">Answer: ${LET[q.ai]}. ${esc(q.options[q.ai])}</span>${x.top && x.top !== q.answer ? ` <span class="muted">· you usually pick</span> <span style="color:var(--red)">${x.top}. ${esc(q.options[x.top.charCodeAt(0) - 65])}</span>` : ''}</div></div>`; }).join('')}
  </section>` : ''}
  ${sl.length ? `<section class="panel"><h3>Slow to answer</h3><p class="small muted" style="margin-bottom:6px">Questions that take you much longer than your average of ${fmtT(T.avgMs)}. Right but slow still costs you in an exam.</p>${sl.map(x => `<div class="mq"><div class="small muted">${x.id} · about ${fmtT(x.avg)}</div><div>${esc(QS[x.id].question)}</div></div>`).join('')}<div class="row" style="margin-top:8px"><button class="btn small" data-act="drill-ids" data-ids="${sl.map(x => x.id).join(',')}">Practise these</button></div></section>` : ''}
  ${hist.length ? `<section class="panel"><h3>History</h3>${hist.map(([s, i]) => histRow(s, i)).join('')}</section>` : ''}
  ${dataTools()}`;
}
function dataTools() {
  return `<section class="panel"><h3>Your data</h3>
    <p class="small muted" style="margin-bottom:10px">Progress is saved in this browser only. Export a backup now and then, especially before clearing browser data or switching devices.</p>
    <div class="row"><button class="btn" data-act="export">Export backup</button><button class="btn" data-act="import">Import backup</button><button class="btn warn" data-act="reset">Erase all progress</button></div></section>`;
}

/* =====================================================================
   Actions and events
   ===================================================================== */
const runPreset = (p, label) => startSession('practice', buildDeck(p), { label });
const A = {
  nav: el => { if (S && view === 'run') return; go(el.dataset.v); },
  theme: () => { const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); db.set.theme = t; save(); },
  'run-preset': el => { const s = SUGG[+el.dataset.i]; runPreset(s.preset, s.label); },
  'go-test': () => { ui.test.count = 20; ui.test.scope = 'all'; go('test'); },
  'chapter-start': el => runPreset({ scope: el.dataset.k, filter: 'smart', order: 'seq', count: 20 }, chTitle(el.dataset.k)),
  set: el => {
    let v = el.dataset.v; if (/^\d+$/.test(v)) v = +v; const t = el.dataset.t, k = el.dataset.k;
    ui[t][k] = v; render();
  },
  'start-practice': () => { const P = ui.prac; runPreset(P, `${P.scope === 'all' ? 'All chapters' : chTitle(P.scope)} · ${FILTER_LABEL[P.filter]}`); },
  'start-flash': () => { const P = ui.prac; startSession('flash', buildDeck(P), { label: `${P.scope === 'all' ? 'All chapters' : chTitle(P.scope)} · ${FILTER_LABEL[P.filter]}` }); },
  'start-test': () => { const T = ui.test; startSession('test', buildTestDeck(), { label: T.scope === 'all' ? 'All chapters' : chTitle(T.scope), perQ: T.perQ, neg: T.neg }); },
  'practice-one': el => startSession('practice', [el.dataset.id], { label: 'Single question' }),
  pick: el => pick(+el.dataset.oi),
  next: () => next(), prev: () => prev(),
  jump: el => jump(+el.dataset.i),
  guess: () => { S.guess = !S.guess; render(); },
  bm: () => { const r = getRec(cur()); r.bm = r.bm ? 0 : 1; saveSoon(); render(); },
  'bm-card': el => { const r = getRec(el.dataset.id); r.bm = r.bm ? 0 : 1; saveSoon(); const y = window.scrollY; render(); window.scrollTo(0, y); },
  flag: () => { const id = cur(); S.flag[id] = !S.flag[id]; render(); },
  'submit-test': () => finishTest(false),
  'exit-run': () => exitRun(),
  flip: () => flipCard(), fgot: () => flashGot(), fmiss: () => flashMiss(),
  'sum-filter': el => { ui.sumFilter = el.dataset.v; render(); },
  'sum-retry': () => { const ids = SUM.res.filter(r => !r[2]).map(r => r[0]).concat(SUM.skip || []); startSession('practice', ids, { label: 'Retry: misses' }); },
  'nb-set': el => { ui.nb.filter = el.dataset.v; ui.nb.limit = 30; render(); },
  'nb-more': () => { ui.nb.limit += 30; const y = window.scrollY; render(); window.scrollTo(0, y); },
  'nb-practice': () => startSession('practice', nbIds(), { label: `Notebook · ${NB_LABEL[ui.nb.filter]}` }),
  'nb-flash': () => startSession('flash', nbIds(), { label: `Notebook · ${NB_LABEL[ui.nb.filter]}` }),
  'nb-print': () => printSheet(nbIds()),
  drill: el => runPreset({ scope: el.dataset.k, filter: 'smart', order: 'rand', count: 20 }, chTitle(el.dataset.k)),
  'drill-due': () => runPreset({ scope: 'all', filter: 'due', order: 'rand', count: 20 }, 'Due for review'),
  'drill-ids': el => startSession('practice', el.dataset.ids.split(',').filter(id => QS[id]), { label: 'Targeted drill' }),
  'flash-ch': el => startSession('flash', buildDeck({ scope: el.dataset.k, filter: 'all', order: 'rand', count: 20 }), { label: chTitle(el.dataset.k) }),
  'open-session': el => { SUM = db.sessions[+el.dataset.i]; ui.sumFilter = 'wrong'; go('summary'); },
  export: () => {
    const blob = new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `practice-progress-${dayKey(Date.now())}.json`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast('Backup downloaded.');
  },
  import: () => $('#import-file').click(),
  reset: () => {
    if (!confirm('Erase ALL progress, notes, bookmarks and history on this device? This cannot be undone. Export a backup first if unsure.')) return;
    const theme = db.set.theme; db = blank(); db.migrated = 1; db.set.theme = theme; save(); toast('Progress erased.'); render();
  }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const f = A[el.dataset.act]; if (f) f(el, e); });

document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('select[data-sel]')) { ui[t.dataset.t][t.dataset.k] = t.value; render(); }
  else if (t.matches('input[data-set]')) { db.set[t.dataset.set] = t.checked; save(); }
  else if (t.matches('input[data-test-neg]')) { ui.test.neg = t.checked; }
  else if (t.matches('input[data-set-num]')) { const v = Math.max(1, Math.min(500, parseInt(t.value, 10) || 20)); db.set[t.dataset.setNum] = v; save(); render(); }
  else if (t.id === 'import-file') {
    const f = t.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => {
      try {
        const inc = JSON.parse(rd.result); if (!inc || inc.v !== 2 || typeof inc.q !== 'object') throw new Error('bad');
        Object.keys(inc.q).forEach(id => { if (!QS[id]) return; const a = db.q[id], b = inc.q[id]; const ta = a && a.a.length ? lastOf(a.a)[0] : 0, tb = b.a && b.a.length ? lastOf(b.a)[0] : 0; if (!a || tb > ta) db.q[id] = Object.assign({ a: [], streak: 0, due: 0, bm: 0, note: '' }, b); else { if (b.bm) a.bm = 1; if (!a.note && b.note) a.note = b.note; } });
        Object.keys(inc.days || {}).forEach(k => { const x = db.days[k], y = inc.days[k]; if (!x || y.n > x.n) db.days[k] = y; });
        const have = new Set(db.sessions.map(s => s.t)); (inc.sessions || []).forEach(s => { if (!have.has(s.t)) db.sessions.push(s); });
        db.sessions.sort((a, b) => a.t - b.t); db.sessions = db.sessions.slice(-40); db.migrated = 1;
        save(); toast('Backup merged into your progress.'); render();
      } catch (err) { toast('That file is not a valid backup from this portal.'); }
      t.value = '';
    };
    rd.readAsText(f);
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('textarea[data-note]')) { getRec(t.dataset.note).note = t.value.slice(0, 600); saveSoon(); }
  else if (t.id === 'q-search') { ui.search = t.value; $('#search-results').innerHTML = searchHtml(); }
});
document.addEventListener('keydown', e => {
  if (view !== 'run' || !S) return;
  const tag = e.target.tagName; if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SELECT') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (S.type === 'flash') {
    if (k === ' ' || k === 'enter') { e.preventDefault(); flipCard(); }
    else if (k === 'arrowleft') flashMiss(); else if (k === 'arrowright') flashGot();
    return;
  }
  if (k.length === 1 && '1234'.includes(k)) pick(S.order[cur()][+k - 1]);
  else if (k.length === 1 && 'abcd'.includes(k)) pick(S.order[cur()][LET.indexOf(k.toUpperCase())]);
  else if (k === 'arrowright' || k === 'n') next();
  else if (k === 'arrowleft' || k === 'p') prev();
  else if (k === 'f') A[S.type === 'test' ? 'flag' : 'bm']();
  else if (k === 'g' && S.type === 'practice' && db.set.guess && !S.ans[cur()]) A.guess();
});
window.addEventListener('beforeunload', () => { clearTimeout(saveTimer); save(); });

/* =====================================================================
   Init
   ===================================================================== */
function initPortal() {
  loadDB();
  const theme = db.set.theme || localStorage.getItem('portal-ui-theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  render();
}
window.onload = initPortal;
</script>
</body>
</html>
